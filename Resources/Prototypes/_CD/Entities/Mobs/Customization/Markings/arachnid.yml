    shader: unshaded

- type: marking
  id: ArachnidEyesRoundGlowing
  bodyPart: Eyes
  groupWhitelist: [ Arachnid ]
  coloring:
    default:
      type:
        !type:EyeColoring
  sprites:
  - sprite: _CD/Mobs/Customization/Arachnid/eyes.rsi
    state: round1
    shader: unshaded
  - sprite: _CD/Mobs/Customization/Arachnid/eyes.rsi
    state: round2
