# Admin presets for the central command announcement window.
# Bracketed parts are placeholders meant to be replaced by the admin.

- type: announcePreset
  id: AnnouncePresetReportRequest
  name: Запрос отчёта
  text: "Внимание, командование станции. Говорит Центральное Командование. Требуем отчёт о состоянии станции и ходе выполнения текущей цели в течение [время]. Просрочка или игнорирование приказа повлекут санкции."

- type: announcePreset
  id: AnnouncePresetReportReminder
  name: Запрос отчёта (напоминание)
  text: "Внимание, командование станции. Говорит Центральное Командование. Напоминаем: на предоставление отчёта осталось [время]. При его отсутствии будут применены административные санкции."

- type: announcePreset
  id: AnnouncePresetGoalDone
  name: Цель выполнена
  text: "Внимание, экипаж станции. Говорит Центральное Командование. Отчёт получен, цель смены признана выполненной. Смена завершается, вступает в силу протокол эвакуации экипажа. Благодарим за проделанную работу."

- type: announcePreset
  id: AnnouncePresetGoalPartial
  name: Цель выполнена частично
  text: "Внимание, экипаж станции. Говорит Центральное Командование. Отчёт получен, цель смены признана выполненной частично. Смена завершается, вступает в силу протокол эвакуации. Оклад экипажа снижен на [процентов] процентов."

- type: announcePreset
  id: AnnouncePresetGoalFail
  name: Цель провалена
  text: "Внимание, экипаж станции. Говорит Центральное Командование. Отчёт получен, цель смены признана проваленной. Смена завершается, вступает в силу протокол эвакуации. Оплата за смену аннулирована согласно условиям контракта."

- type: announcePreset
  id: AnnouncePresetSalary
  name: Изменение оклада
  text: "Внимание, экипаж станции. Говорит Центральное Командование. Оклад [отдела/сотрудника] изменён на [процентов] процентов."

- type: announcePreset
  id: AnnouncePresetRepresentative
  name: Отправка представителя
  text: "Внимание, командование станции. Говорит Центральное Командование. Для разбирательства по вопросу [тема] на станцию направлен представитель Центрального Командования. Ожидайте его прибытия."

- type: announcePreset
  id: AnnouncePresetImmunity
  name: Снятие неприкосновенности
  text: "Внимание, командование станции. Говорит Центральное Командование. С [должность] снимается юридическая неприкосновенность на основании статьи [номер] Корпоративного кодекса. Службе безопасности станции предписано провести задержание."

- type: announcePreset
  id: AnnouncePresetHolopadSummons
  name: Вызов на мостик (голопад)
  text: |-
    Уважаемое командование станции ${station}.

    Центральное командование вызывает на мостик Бригмедика, Квартирмейстера, а также Главного врача для проведения переговоров посредством голопада.
    Вызванным сотрудникам необходимо явиться на мостик в кратчайшие сроки.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetLavaquake
  name: Землетрясение (Лаваленд)
  text: |-
    Внимание всем сотрудникам NanoTrasen, находящимся на территории Лаваленда.

    Центральный информационный интерфейс сообщает о прогнозируемом землетрясении, которое, согласно полученным данным, начнётся через 15 минут. В целях обеспечения безопасности персонала всем сотрудникам, находящимся на территории объекта, необходимо незамедлительно приступить к эвакуации и покинуть Лаваленд до начала природного катаклизма.

    Просим отнестись к данному предупреждению со всей серьёзностью. Ответственность за соблюдение мер безопасности возлагается на каждого сотрудника.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetComplaintCheck
  name: Проверка по жалобе
  text: |-
    Внимание представителю NanoTrasen на станции ${station}.

    В связи с поступившей жалобой после завершения смены будет проведена проверка соблюдения стандартных рабочих процедур командованием станции, включая действия Капитана.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetRDSummons
  name: Вызов научного руководителя
  text: |-
    Внимание командованию станции ${station}.

    Центральное командование вызывает Научного руководителя станции на мостик для проведения совещания по вопросу исполнения ранее отправленного приказа.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetEarlyShiftEnd
  name: Досрочное завершение смены
  text: |-
    Внимание командованию станции ${station}.

    Центральное командование уведомляет, что в связи с надвигающимся природным явлением было принято решение о досрочном завершении смены. Протоколы эвакуации вступают в силу немедленно.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetReportApproved
  name: Отчёт одобрен
  text: |-
    Уважаемое командование станции ${station}.

    Отчёт рассмотрен Центральным командованием. Командованию станции разрешено приступить к выполнению протоколов эвакуации.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetGoalFailedEvac
  name: Цель провалена (эвакуация)
  text: |-
    Уважаемое командование станции ${station}.

    В связи с текущей ситуацией на станции цель смены признана проваленной. Командованию одобрены протоколы эвакуации. Выплата за смену отменена.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetSitrepRequest
  name: Запрос отчёта о ситуации
  text: |-
    Внимание командованию станции ${station}.

    Центральное командование запрашивает отчёт о текущей ситуации на станции. На подготовку и отправку отчёта предоставляется 15 минут.

    Напоминаем, что игнорирование СРП может приравниваться к невыполнению цели смены и повлечь за собой административные санкции.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetExternalPower
  name: Внешнее электропитание
  text: |-
    Уважаемое командование станции ${station}.

    В связи с недостаточным количеством сотрудников на станции принято решение подключить объект к внешнему электропитанию.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetPlushieDelivery
  name: Доставка плюшевых игрушек
  text: |-
    Уважаемое командование станции ${station}.

    Оператор Центрального командования направляет на станцию коллекцию плюшевых игрушек из личного собрания. Забрать ящик можно на ближайшем торговом посту.

    Слава NanoTrasen!

- type: announcePreset
  id: AnnouncePresetSpiceDelivery
  name: Доставка специй
  text: |-
    Уважаемое командование станции ${station}.

    В рамках повышения качества и вкусовых характеристик продуктов на станцию было отправлено два ящика со специями. Забрать груз можно на ближайшем торговом посту.

    Слава NanoTrasen!
