- type: entity
  parent: BaseItem
  id: RadioHandheldEmpty
  name: handheld radio
  description: A handy handheld radio.
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    toggleOnInteract: false
  - type: RadioSpeaker
    toggleOnInteract: false
  - type: Speech
    speechVerb: Robotic
  - type: EncryptionKeyHolder
    keySlots: 3
  - type: ActivatableUI
    key: enum.IntercomUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
  - type: Intercom
  - type: Sprite
    sprite: _WL/Objects/Devices/communication.rsi # WL-Changes-resprite
    layers:
    - state: walkietalkie
    - map: [enum.RadioDeviceVisualLayers.Broadcasting]
      state: walkietalkie-on
      shader: unshaded
      visible: false
    - map: [enum.RadioDeviceVisualLayers.Speaker]
      state: walkietalkie-active
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RadioDeviceVisuals.Broadcasting:
        enum.RadioDeviceVisualLayers.Broadcasting:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Speaker:
        enum.RadioDeviceVisualLayers.Speaker:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    sprite: _WL/Objects/Devices/communication.rsi # WL-Changes-resprite
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio
  #- type: Languages # WL-Changes

- type: entity
  parent: [ BaseCorvaxContraband433DepartmentsCommandSecurity, RadioHandheld, BaseSecurityContraband ] # Corvax-Contraband
  id: RadioHandheldSecurity
  name: security radio
  description: A handy security radio.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySecurity
  - type: Sprite
    sprite: _WL/Objects/Devices/securityhandy.rsi # WL-Changes-resprite
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
      map: ["enum.RadioDeviceVisualLayers.Broadcasting"]
      shader: unshaded
      visible: false
    - sprite: _WL/Objects/Devices/communication.rsi
      state: walkietalkie-active
      map: ["enum.RadioDeviceVisualLayers.Speaker"]
      shader: unshaded
      visible: false
  - type: Item
    sprite: _WL/Objects/Devices/securityhandy.rsi # WL-Changes-resprite
    heldPrefix: walkietalkie

- type: entity
  name: handheld radio
  description: A handy handheld radio.
  parent: RadioHandheldEmpty
  id: RadioHandheld
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyHandheld
