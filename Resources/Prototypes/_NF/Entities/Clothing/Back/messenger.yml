# BASE
# Ported from Goob-station-Master: Prototypes\_NF\Entities\Clothing\Back\messenger.yml

- type: entity
  parent: ClothingBackpackMessengerBase
  id: ClothingBackpackMessengerSalvage
  name: salvage messenger bag
  description: A robust bag for stashing Lavaland loot.
  components:
  - type: Sprite
    layers:
    - state: icon-base
      color: "#766245"
    - state: icon-sling
      color: "#766245"
    - state: icon-clasp
      color: "#5f539a"
  - type: Clothing
    clothingVisuals:
      back:
      - state: base-equipped-BACKPACK
        color: "#766245"
      - state: sling-equipped-BACKPACK
        color: "#766245"
      - state: clasp-equipped-BACKPACK
        color: "#5f539a"
  - type: Item
    inhandVisuals:
      left:
      - state: base-inhand-left
        color: "#766245"
      - state: clasp-inhand-left
        color: "#5f539a"
      right:
      - state: base-inhand-right
        color: "#766245"
      - state: clasp-inhand-right
        color: "#5f539a"

- type: entity
  parent: ClothingBackpackMessengerBase
  id: ClothingBackpackMessengerMailman
  name: clothing-backpack-mailman
  description: clothing-backpack-mailman-desc
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/mailman.rsi
  - type: Clothing
    sprite: _NF/Clothing/Back/Messenger/mailman.rsi
  - type: Item
    sprite: _NF/Clothing/Back/Messenger/mailman.rsi

# Medical

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackMessengerBase
  abstract: true
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/color.rsi
  - type: Storage
    grid:
    - 0,0,7,0
    - 0,2,7,3
    - 0,5,7,5
    - 0,0,0,5
    - 7,0,7,5

