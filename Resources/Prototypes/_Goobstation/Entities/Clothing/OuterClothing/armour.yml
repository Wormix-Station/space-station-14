# Captain

- type: entity
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorVeteranSecurity
  name: Veteran security's old armor
  description: An old version of the standard NanoTrasen bulletproof vest, its design provides better protection against surprise attacks by clowns, it still meets NT's protection standards
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Armor/veteran_security.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Armor/veteran_security.rsi

- type: entity
  parent: [ ClothingOuterArmorCaptainCarapace, ClothingOuterStorageBase ]
  id: ClothingOuterCapJacket
  name: captain's armored jacket
  description: An extremely expensive jacket with extra durathread protection at the chest.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Armor/captain_jacket.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Armor/captain_jacket.rsi
  - type: Item
    size: Normal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.45
        Heat: 0.35
        Caustic: 0.6

- type: entity
  parent: [ ClothingOuterArmorCaptainCarapace, ClothingOuterWinterCoatToggleable ]
  id: ClothingOuterWinterCapArmored
  name: captain's fancy winter coat
  description: An ornate winter coat with a ballistic plate made for the station's finest.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Wintercoats/cap_armored_winter_coat.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Wintercoats/cap_armored_winter_coat.rsi
  - type: Item
    size: Normal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.5
        Heat: 0.4
        Caustic: 0.65
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodWinterCapFancy

