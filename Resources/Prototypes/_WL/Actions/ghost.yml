  name: Toggle HUDs
  description: Switch between the medical HUD and normal vision.
  categories: [HideSpawnMenu]
  components:
    - type: Action
      checkCanInteract: false
    - type: InstantAction
      event: !type:ToggleMedicalHudActionEvent
    - type: Sprite
      sprite: Clothing/Eyes/Hud/omni.rsi
      state: icon
