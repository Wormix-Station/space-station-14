- type: entity
  id: TP14SMESAdvancedMachineCircuitboard
  parent: BaseMachineCircuitboard
  suffix: Trieste, Circuit-Board
  name: trieste's advanced SMES machine board
  description: A machine printed circuit board for a trieste-speciifc Advanced SMES.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: power_mod
  - type: MachineBoard
    prototype: TP14SMESAdvancedEmpty
    stackRequirements:
      Manipulator: 3
      CableHV: 30
    componentRequirements:
      PowerCell:
        amount: 8
        defaultPrototype: PowerCellMedium

- type: entity
  id: TP14CoffeeMakerCircuitboard
  parent: BaseMachineCircuitboard
  suffix: Trieste, Circuit-Board
  name: coffee maker machine board
  components:
    - type: Sprite
      state: service
    - type: MachineBoard
      prototype: TP14CoffeeMaker
      stackRequirements:
        Manipulator: 3
        Steel: 20
        Cable: 6
    - type: Tag
      tags:
      - TP14TagCoffeeMakerBoard



- type: entity
  id: TP14ColdplateMachineCircuitboard
  parent: BaseMachineCircuitboard
  suffix: Trieste, Circuit-Board
  name: coldplate machine board
  description: A machine printed circuit board for a coldplate.
  components:
    - type: MachineBoard
      prototype: TP14ChemistryColdplate
      stackRequirements:
        Manipulator: 2
        Glass: 1


- type: entity
  id: IncubatorMachineCircuitboard
  parent: BaseMachineCircuitboard
  suffix: Trieste, Circuit-Board
  name: incubator machine board
  description: A machine printed circuit board for an incubator.
  components:
    - type: Sprite
      state: medical
    - type: MachineBoard
      prototype: MachineIncubator
      stackRequirements:
        Manipulator: 2
        Glass: 1
        Steel: 1
