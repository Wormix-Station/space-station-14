# TP14 weather events, ported from Trieste Port-14.

- type: entity
  id: TP14FlashStorm
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-flash-storm-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    endAnnouncement: station-event-flash-storm-end-announcement
    weight: 1
    duration: 181       # Exactly the amount of time that the song lasts.
    maxOccurrences: 1
    minimumPlayers: 10
  - type: GameRule
    delay:
      min: 30
      max: 60
  - type: FlashStormRule
    stormWeather: "WeatherStorm"
    normalWeather: "WeatherRain"

- type: entity
  id: TP14RainClear
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-rain-clear-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    endAnnouncement: station-event-rain-clear-end-announcement
    weight: 2
    duration: 201
  - type: GameRule
    delay:
      min: 5
      max: 10
  - type: WeatherChangeRule
    targetWeather: "WeatherClear"
    returnWeather: "WeatherRain"
    lightning: false
    sunlight: true

- type: entity
  id: TP14CloudStormEvent
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-cloud-storm-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    endAnnouncement: station-event-cloud-storm-end-announcement
    weight: 3
    duration: 200
  - type: GameRule
    delay:
      min: 10
      max: 15
  - type: WeatherChangeRule
    targetWeather: "WeatherCloudStorm"
    returnWeather: "WeatherRain"
    lightning: true
