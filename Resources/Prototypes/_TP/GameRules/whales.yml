# Whale migration events (ported from Trieste Port-14).

# This should only play in Sweetwater, but it's apparently "so insanely fucked do not use it for anything holy moly."
- type: entity
  id: WhaleMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: whale-migration
    startAudio:
      path: /Audio/_TP/Effects/whale_groan.ogg
    earliestStart: 5
    minimumPlayers: 1
    weight: 6
    duration: 100
  - type: MassHallucinationsRule
    minTimeBetweenIncidents: 10
    maxTimeBetweenIncidents: 60
    maxSoundDistance: 7
    sweetwaterOnly: false
    sounds:
      collection: WhaleMigration
  - type: WhaleMigrationRule

- type: entity
  id: DeathWhaleMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 0
    minimumPlayers: 5
    maxOccurrences: 1
    weight: 5
  - type: OceanSpawnRule
    prototype: MobDeathWhale
    amount: 5
